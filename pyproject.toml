[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-reading-list"
version = "0.1.0"
description = "A collection of useful resources related to plasma physics, material science, fusion power and machine learning created by students on the EPSRC CDT in Fusion Power."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["zensical>=0.0.68"]
maintainers = [
    { name = "Bailey Cook", email = "bailey.cook@york.ac.uk" },
    { name = "Joel Adams", email = "joel.adams@york.ac.uk" },
]

# Installed with `uv sync`, but not when the site is installed as a package.
[dependency-groups]
# What the issue workflows' scripts need. The workflows install only this
# group (`uv run --only-group scripts ...`), not Zensical.
scripts = ["pyyaml==6.0.3"]
dev = ["pytest", { include-group = "scripts" }]

[tool.hatch.build.targets.wheel]
include = [
    "scripts/doi_reference.py",
    "scripts/contributors.py",
    "scripts/title_reference.py",
]

[tool.hatch.build.targets.wheel.sources]
"scripts" = ""
