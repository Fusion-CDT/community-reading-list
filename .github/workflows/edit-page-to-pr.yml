name: Convert edit suggestion to PR
on:
  issues:
    types: [opened]

jobs:
  apply-edit:
    if: |
      contains(github.event.issue.labels.*.name, 'edit-literature') ||
      contains(github.event.issue.labels.*.name, 'edit-tutorial')
    runs-on: ubuntu-latest
    # The repository's default token is read-only
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Only the scripts' dependencies (PyYAML), pinned in uv.lock
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Apply the edit
        id: edit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: uv run --locked --only-group scripts scripts/apply_edit.py

      - name: Store images in the repository
        env:
          NOTE: ${{ steps.edit.outputs.filepath }}
          UPLOADS: ${{ steps.edit.outputs.user_images }}
        run: uv run --locked --only-group scripts scripts/localise_images.py "$NOTE" "$UPLOADS"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          commit-message: "${{ github.event.issue.title }}"
          title: "${{ github.event.issue.title }}"
          body: |
            Auto-generated PR applying an edit suggested via issue.

            Suggested by @${{ github.event.issue.user.login }}

            Closes #${{ github.event.issue.number }}
          branch: "edit-page-${{ github.event.issue.number }}"
          delete-branch: true
