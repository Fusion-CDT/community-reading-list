name: Edit existing tutorial
description: Propose a correction or improvement to an existing tutorial page.
labels: ["edit-tutorial"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Fusion CDT Community Reading List!

        Before filling in the form below, navigate to the page on the
        [reading list site](https://fusion-cdt.github.io/community-reading-list/)
        so you can view and copy its current content.

  - type: textarea
    id: description
    attributes:
      label: What needs changing?
      description: Describe what is incorrect or could be improved, and why.
      placeholder: "e.g. The link to the GS2 documentation is outdated."
    validations:
      required: true

  - type: textarea
    id: proposed_content
    attributes:
      label: Proposed content
      description: |
        The new markdown content for the page body (everything after the opening `---` frontmatter block).
        Copy the existing content from the page, make your changes, and paste the result here.
      placeholder: "Your improved content here..."
    validations:
      required: true

  - type: upload
    id: user_images
    attributes:
      label: Images (optional)
      description: |
        Upload any images used in your Proposed content, and refer to each one by its filename, e.g.
        `![Diagram of the experiment](diagram.png)`. They'll be stored next to the page.
        You can also paste images straight into the Proposed content box; they'll be stored too.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp"

  - type: input
    id: contributor_name
    attributes:
      label: Your name (optional)
      description: Your full name, to be credited as a contributor to this note.
      placeholder: "e.g. Bailey Cook"
    validations:
      required: false
