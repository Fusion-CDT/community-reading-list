name: "Suggest literature: textbook"
description: Suggest a textbook to add to the reading list.
labels: ["textbook-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the Fusion CDT Community Reading List! Please fill in as much detail as you can below.

  - type: input
    id: title
    attributes:
      label: Title
      description: The full title of the textbook.
      placeholder: "e.g. Plasma Physics and Fusion Energy"
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Authors
      description: The author(s) of the textbook.
      placeholder: "e.g. Jeffrey P. Freidberg"
    validations:
      required: true

  - type: input
    id: isbn
    attributes:
      label: ISBN
      description: The ISBN of the textbook, if known.
      placeholder: "e.g. 978-0-521-73317-5"
    validations:
      required: false

  - type: input
    id: availability
    attributes:
      label: Availability (optional)
      description: Where the textbook can be accessed, e.g. online, in the YPI library, etc. This is especially useful for books that are available but not listed on the library website.
      placeholder: "e.g. YPI library"
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: URL(s)
      description: A link to the textbook (e.g. publisher page or open-access version), if available. Additional links to other material. Separate multiple URLs with commas.
      placeholder: "e.g. https://example.com/book, https://example.com/book/lecture"
    validations:
      required: false

  - type: input
    id: url_name
    attributes:
      label: URL name(s)
      description: Replace the raw URLs with specific names, if unspecified then the raw links are rendered. Separate multiple URL names with commas.
      placeholder: "e.g. Book, Accompanying lecture slides"
    validations:
      required: false

  - type: input
    id: filepath
    attributes:
      label: Location and filename
      description: Where in the reading list should this live and what should it be called? Give a folder path under `literature/`, then a filename of the form `<firstauthor><year><short-title>` (see the [filename convention](https://github.com/Fusion-CDT/community-reading-list/blob/main/CONTRIBUTING.md#filename-convention-for-literature-notes)).
      placeholder: "e.g. plasma/MCF/freidberg2007plasma-physics-and-fusion-energy"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags. Please reuse tags from the [Tags page](https://fusion-cdt.github.io/community-reading-list/tags/) where possible.
      placeholder: "e.g. MCF, MHD, Tokamak physics"
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Content
      description: Why this is useful and what you'd like to highlight. Please use Markdown ([cheat sheet](https://www.markdownguide.org/cheat-sheet/)) and LaTeX for maths (e.g. `$\chi_e$`).
      placeholder: "e.g. Excellent introductory textbook covering both plasma physics fundamentals and fusion engineering."
    validations:
      required: true

  - type: upload
    id: user_images
    attributes:
      label: Images (optional)
      description: |
        Upload any images used in your Content, and refer to each one by its filename, e.g.
        `![Diagram of the experiment](diagram.png)`. They'll be stored next to the page.
        You can also paste images straight into the Content box; they'll be stored too.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp"

  - type: input
    id: contributor_name
    attributes:
      label: Your name (optional)
      description: Your full name, to be credited as a contributor to this note.
      placeholder: "e.g. Bailey Cook"
    validations:
      required: false
