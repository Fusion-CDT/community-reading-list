name: "Edit literature: lecture notes or slides"
description: Propose a correction or improvement to an existing page for lecture notes or slides. Please start from the ✏️ edit button on the page itself.
labels: ["edit-lecture-notes"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Fusion CDT Community Reading List!

        This form should be opened from the ✏️ edit button at the top of the page you want to change on the [reading list site](https://fusion-cdt.github.io/community-reading-list/), so that the page's path is in the title above and the boxes below are filled in with the page's current details and text. If you opened it from the list of issue templates instead, please go back and use the edit button.

  - type: textarea
    id: description
    attributes:
      label: What needs changing?
      description: Describe what is incorrect or could be improved, and why.
      placeholder: "e.g. The link to part 2 of the notes is broken."
    validations:
      required: true

  - type: input
    id: resource_title
    attributes:
      label: Title
      description: The full title of the lecture notes or slides.
      placeholder: "e.g. EPFL Plasma Physics: Introduction & Applications"
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Author(s) (optional)
      description: The author(s) of the lecture notes or slides, if known.
      placeholder: "e.g. Felix Parra Diaz"
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: URL(s)
      description: Links to the material. Separate multiple URLs with commas.
      placeholder: "e.g. https://example.com/part1.pdf, https://example.com/part2.pdf"
    validations:
      required: false

  - type: input
    id: url_name
    attributes:
      label: URL name(s)
      description: The text to show for each link, in the same order. If left empty, the raw links are shown. Separate multiple names with commas.
      placeholder: "e.g. Plasma Physics 1, Plasma Physics 2"
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags. Please reuse tags from the [Tags page](https://fusion-cdt.github.io/community-reading-list/tags/) where possible.
      placeholder: "e.g. MCF, Kinetic theory, Braginskii"
    validations:
      required: true

  - type: textarea
    id: proposed_content
    attributes:
      label: Proposed content
      description: |
        This box is pre-filled with the page's current text, so make your changes here. If it's empty (very long pages can't be pre-filled), copy the page's text from its source on [GitHub](https://github.com/Fusion-CDT/community-reading-list/tree/main/docs), at the path shown in the title above.
      placeholder: "Your improved description here..."
    validations:
      required: true

  - type: upload
    id: user_images
    attributes:
      label: Images (optional)
      description: |
        Upload any images used in your Proposed content, and refer to each one by its filename, e.g. `![Diagram of the experiment](diagram.png)`. They'll be stored next to the page. You can also paste images straight into the Proposed content box; they'll be stored too.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp"

  - type: input
    id: contributor_name
    attributes:
      label: Your name (optional)
      description: You'll be credited as a contributor at the bottom of the page by your GitHub username, linked to your GitHub profile, e.g. [baiway](https://github.com/baiway). Add your full name to be credited by name instead, still linked to your profile, e.g. [Bailey Cook](https://github.com/baiway).
      placeholder: "e.g. Bailey Cook"
    validations:
      required: false
