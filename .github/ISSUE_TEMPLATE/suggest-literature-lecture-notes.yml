name: "Suggest literature: lecture notes or slides"
description: Suggest a set of lecture notes or slides to add to the reading list.
labels: ["lecture-notes-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the Fusion CDT Community Reading List!
        Please fill in as much detail as you can below.

  - type: input
    id: title
    attributes:
      label: Title
      description: The full title of the lecture notes or slides.
      placeholder: "e.g. EPFL Plasma Physics: Introduction & Applications"
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Author(s) (optional)
      description: The author(s) of the lecture notes or slides, if known.
      placeholder: "e.g. Felix Parra Diaz"
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: URL(s)
      description: Link(s) to the notes or slides, if publicly available. Separate multiple URLs with commas.
      placeholder: "e.g. https://example.com/part1.pdf, https://example.com/part2.pdf"
    validations:
      required: false

  - type: input
    id: url_name
    attributes:
      label: URL name(s)
      description: Replace the raw URLs with specific names, if unspecified then the raw links are rendered. Separate multiple URL names with commas.
      placeholder: "e.g. Plasma Physics 1, Plasma Physics 2"
    validations:
      required: false

  - type: input
    id: filepath
    attributes:
      label: Location and filename
      description: Where in the reading list should this live and what should it be called? Give a folder path under `literature/`, then a filename of the form `<firstauthor><year><short-title>` (see the [filename convention](https://github.com/Fusion-CDT/community-reading-list/blob/main/CONTRIBUTING.md#filename-convention-for-literature-notes)).
      placeholder: "e.g. plasma/MCF/parra2019collisional-plasma-physics"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags. Please reuse tags from the [Tags page](https://fusion-cdt.github.io/community-reading-list/tags/) where possible.
      placeholder: "e.g. MCF, Kinetic theory, Braginskii"
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Content
      description: Why this is useful and what you'd like to highlight. Please use Markdown ([cheat sheet](https://www.markdownguide.org/cheat-sheet/)) and LaTeX for maths (e.g. `$\chi_e$`).
      placeholder: "e.g. Comprehensive introduction to plasma physics covering MHD and kinetic theory."
    validations:
      required: true

  - type: input
    id: contributor_name
    attributes:
      label: Your name (optional)
      description: Your full name, to be credited as a contributor to this note.
      placeholder: "e.g. Bailey Cook"
    validations:
      required: false
