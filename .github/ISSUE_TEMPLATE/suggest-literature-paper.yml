name: "Suggest literature: paper"
description: Suggest a journal article or preprint to add to the reading list.
labels: ["paper-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the Fusion CDT Community Reading List!
        Please fill in as much detail as you can below.

  - type: input
    id: doi
    attributes:
      label: DOI
      description: The DOI of the paper, if available.
      placeholder: "e.g. 10.1063/1.2178779"
    validations:
      required: false

  - type: input
    id: filepath
    attributes:
      label: Location and filename
      description: Where in the reading list should this live and what should it be called? Give a folder path under `literature/`, then a filename of the form `<firstauthor><year><short-title>` (see the [filename convention](https://github.com/Fusion-CDT/community-reading-list/blob/main/CONTRIBUTING.md#filename-convention-for-literature-notes)).
      placeholder: "e.g. plasma/MCF/gyrokinetics/abel2013multiscale-gyrokinetics"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags. Please reuse tags from the [Tags page](https://fusion-cdt.github.io/community-reading-list/tags/) where possible.
      placeholder: "e.g. MCF, Gyrokinetics, GS2"
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Content
      description: Why this is useful and what you'd like to highlight. Please use Markdown ([cheat sheet](https://www.markdownguide.org/cheat-sheet/)) and LaTeX for maths (e.g. `$\chi_e$`).
      placeholder: "e.g. Essential review paper for anyone starting in gyrokinetics."
    validations:
      required: true

  - type: input
    id: contributor_name
    attributes:
      label: Your name (optional)
      description: Your full name, to be credited as a contributor to this note.
      placeholder: "e.g. Bailey Cook"
    validations:
      required: false
